spring:
  application:
    name: nordic-dev-mentor

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s

server:
  port: ${PORT:8080}

# Allt under "devmentor" är vår egen config bind till @ConfigurationProperties-records.
devmentor:

  conversation:
    # Sliding window-storlek. 10 = ~5 turer fram och tillbaka behålls.
    max-messages: 10

  store:
    # in-memory (default) eller redis. Override via DEVMENTOR_STORE_TYPE.
    type: ${DEVMENTOR_STORE_TYPE:in-memory}

  openrouter:
    # Sätts via miljövariabel
    api-key: ${OPENROUTER_API_KEY:}
    base-url: https://openrouter.ai/api/v1

    model: ${OPENROUTER_MODEL:anthropic/claude-3.5-haiku}
    connect-timeout: 5s
    response-timeout: 60s
    retry:
      max-attempts: 3
      initial-backoff: 500ms
      max-backoff: 4s

# springdoc / Swagger UI på /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    se.devmentor: DEBUG
    org.springframework.web.reactive.function.client: INFO

# Endast health-endpointen ska vara exponerad.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # Redis-deps är på classpath så Spring försöker autoconfigure en RedisHealthIndicator.
  # Vi stänger av den default så tester (och in-memory-läge) inte kräver Redis igång.
  # Aktivera i Redis-läge via MANAGEMENT_HEALTH_REDIS_ENABLED=true.
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

